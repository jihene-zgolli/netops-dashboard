<div class="incident-list">
  <h2>Incidents réseau</h2>

  <div class="filters" *ngIf="!loading() && !error()">
    <input
      type="text"
      placeholder="Rechercher un incident..."
      [ngModel]="searchTerm()"
      (ngModelChange)="onSearchChange($event)"
      class="search-input">

    <select [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event)">
      <option value="all">Tous les statuts</option>
      <option value="open">Ouvert</option>
      <option value="in_progress">En cours</option>
      <option value="resolved">Résolu</option>
    </select>

    <select [ngModel]="severityFilter()" (ngModelChange)="severityFilter.set($event)">
      <option value="all">Toutes les sévérités</option>
      <option value="low">Faible</option>
      <option value="medium">Moyenne</option>
      <option value="high">Haute</option>
      <option value="critical">Critique</option>
    </select>
  </div>

  <p *ngIf="loading()">Chargement...</p>
  <p *ngIf="error()" class="error">{{ error() }}</p>

  <p *ngIf="!loading() && !error() && filteredIncidents().length === 0" class="empty-state">
    Aucun incident ne correspond à ces critères
  </p>

  <table *ngIf="!loading() && !error() && filteredIncidents().length > 0">
    <thead>
      <tr>
        <th>Titre</th>
        <th>Type</th>
        <th>Sévérité</th>
        <th>Statut</th>
        <th class="actions-col">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let incident of filteredIncidents()">
        <td>{{ incident.title }}</td>
        <td>{{ incident.type }}</td>
        <td [class]="'severity-' + incident.severity">{{ incident.severity }}</td>
        <td>
          <select [value]="incident.status" (change)="updateStatus(incident, $any($event.target).value)">
            <option value="open">Ouvert</option>
            <option value="in_progress">En cours</option>
            <option value="resolved">Résolu</option>
          </select>
        </td>
        <td class="actions-col">
          <button class="icon-btn delete" (click)="deleteIncident(incident._id!)" title="Supprimer">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
